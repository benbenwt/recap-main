[package]
name = "recap"
version = "0.1.18"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.versions]
# RECAP_VERSION: Used in capture device specs and metadata
# Version 6 includes mouse acceleration fixes
# Version 7 fixed stuck keys issue by locking earlier during initial keyboard poll
# Version 8 includes (update comment as needed)
# Version 9 fixes: lock input when reading keys; disallow uploading of erroring captures
# Version 10 remove videorate element from GStreamer pipeline seemingly fixing fps issues
# Version 11 adds gamepad input support and playback support
# Version 12 adds events to proto file and a timeline in inputmanager
# Version 13 recap with event fixes and remove in app start/stop
# Version 14 add better event support and reworking all event handling. Reworks metrics and adds graphs
# Version 15 add 10% chance to record in full rgb color profile
# Version 16 hard code simulated to false if inference is disabled. remove some checking code that was wrong. filter out volume keys
# Version 17 fix bug where if the gamepad is not connected after starting recap, it would never be detected
# Version 18 add audio recording support also adds quote key to hold while talking
recap_version = 18

# PROTO_VERSION: Version of the video annotation protocol
# Version 3 of the video annotation protocol (update comment when changing)
# When updating this version, add comment in proto file explaining the change
# Version 4 adds gamepad input support
# Version 5 adds events with times to proto file
# Version 6 adds support for system and user mouse buttons
# Version 7 adds audio key press events
# Version 8 adds flexible key-value metadata (custom_metadata field)
proto_version = 8

[features]
default = ["inference", "playback"]
trace = ["dot_graph"]
window_info = []
convert = ["video_annotation_proto/serialize", "clap"]
dot_graph = ["recap_gst/dot_graph"]
inference = []
playback = []
encoding-check = []
gpu_render = ["iced/wgpu"]

[dependencies]
# input dependencies
device_query.workspace = true

# video processing dependencies
recap_gst.workspace = true


# iced
iced = { features = [
    "tokio",
    "web-colors",
    "auto-detect-theme",
    "canvas",
    "debug",
], workspace = true }
iced_core = { workspace = true }
iced_winit = { workspace = true, features = ["program"] }
iced_futures = { workspace = true }
iced_graphics = { workspace = true }
winit = { workspace = true }
iced_fonts = { workspace = true }

snowline = { git = "https://github.com/n1ght-hunter/snowline.git", rev = "1092b57" }

# gamepad dependencies
gilrs = { version = "0.11.0", default-features = false, features = ["xinput"] }
vigem-client = "0.1.4"
flume = "0.11.1"

serde.workspace = true
serde_json.workspace = true
ron = { workspace = true }
ctrlc = "3.4.5"
clap = { workspace = true, optional = true, features = ["derive"] }
anyhow.workspace = true
tracing-subscriber.workspace = true
nom.workspace = true
tracing.workspace = true
metrics.workspace = true
metrics-util.workspace = true
video_annotation_proto.workspace = true
uuid = { workspace = true, features = ["v7"] }
notify = "8.0.0"
rust-s3 = "0.35.1"
ureq.workspace = true
tokio.workspace = true
rdev.workspace = true
base64.workspace = true
chrono.workspace = true
video_inference_grpc.workspace = true
tokio-stream = "0.1.17"
input_codes.workspace = true
arboard = "3.4.1"
sysinfo = "0.33.1"
derive_more = { workspace = true, features = ["debug", "default"] }
open.workspace = true
parking_lot = "0.12.3"
rodio.workspace = true
rayon.workspace = true
thiserror.workspace = true
zip.workspace = true
window-handling.workspace = true
rand.workspace = true
wsl-tools.workspace = true
fast_image_resize = "=5.1.4"
glam.workspace = true
indexmap = { version = "2.12", features = ["serde"] }
hashbrown = "0.15.5"
quanta = "0.12.6"
itertools.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
window_tracking = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_System_ProcessStatus",
] }
win-programs.workspace = true


[dev-dependencies]
rand.workspace = true
video_inference_grpc = { workspace = true, features = ["server"] }
insta = { version = "1.43.1", features = ["ron"] }
video_annotation_proto = { workspace = true, features = ["serialize"] }

[build-dependencies]
toml = "0.9"


[lints]
workspace = true

[[bin]]
name = "convert"
required-features = ["convert"]

# ============================================================================
# WORKSPACE CONFIGURATION
# ============================================================================

[workspace]
members = [
    "crates/recap_gst",
    "crates/video_annotation_proto",
    "crates/video_inference_grpc",
    "crates/input_codes",
    "crates/window-handling",
    "crates/iced_fonts",
    "crates/win-programs",
    "crates/wsl-tools",
]
resolver = "3"

[workspace.package]
authors = ["elefant ai", "Samuel Hunt <samuelhuntnz@gmail.com>"]
edition = "2024"
rust-version = "1.88.0"
license = "GPL-3.0"

[workspace.dependencies]
# Local dependencies
recap_gst = { path = "crates/recap_gst" }
video_annotation_proto = { path = "crates/video_annotation_proto" }
video_inference_grpc = { path = "crates/video_inference_grpc" }
input_codes = { path = "crates/input_codes" }
window-handling = { path = "crates/window-handling" }
iced_fonts = { path = "crates/iced_fonts" }
win-programs = { path = "crates/win-programs" }
wsl-tools = { path = "crates/wsl-tools" }
window_tracking = { path = "crates/window_tracking" }

# External dependencies
anyhow = "1"
base64 = "0.22.1"
chrono = "0.4"
clap = "4.5"
derive_more = { version = "2.0.1", features = ["deref", "deref_mut", "from"] }
device_query = "4"
futures = "0.3.31"
glam = "0.30"
itertools = "0.14.0"
metrics = "0.24.2"
metrics-util = "0.20.0"
nom = "8.0.0"
open = "5.3"
parking_lot = "0.12"
rand = "0.9"
rayon = "1.11"
rodio = "0.21"
ron = "0.11"
rust-s3 = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive", "std"] }
tempfile = "3.23"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "tracing-log",
] }
tracing-test = "0.2.5"
ureq = { version = "3.1", features = ["json"] }
uuid = "1"
zip = "6"

# must use this fork because how tauri
# link to discussion: https://github.com/tauri-apps/tauri/discussions/7839
rdev = { git = "https://github.com/elefant-ai/rdev.git", rev = "005c995" }

# gstreamer
gst = { package = "gstreamer", version = "0.24" }
gst_app = { package = "gstreamer-app", version = "0.24" }
gst_video = { package = "gstreamer-video", version = "0.24" }
gst_pbutils = { package = "gstreamer-pbutils", version = "0.24" }

# protobuf
prost = "0.14.1"
prost-types = "0.14.1"
prost-build = "0.14.1"
tonic = { git = "https://github.com/elefant-ai/tonic.git", rev = "4329209", features = [
    "tls-native-roots",
    "tls-ring",
] }
tonic-prost = { git = "https://github.com/elefant-ai/tonic.git", rev = "4329209" }
tonic-build = { git = "https://github.com/elefant-ai/tonic.git", rev = "4329209" }
tonic-prost-build = { git = "https://github.com/elefant-ai/tonic.git", rev = "4329209" }

# http
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["full"] }
hyper-util = "0.1"

# windows api
windows = { version = "^0.61" }

# iced / winit
iced_wgpu = { version = "0.14.0-dev" }
iced_core = { version = "0.14.0-dev" }
iced_widget = { version = "0.14.0-dev" }
iced_futures = { version = "0.14.0-dev" }
iced_graphics = { version = "0.14.0-dev" }
iced = { features = [
    "tokio",
], version = "0.14.0-dev", default-features = false }
iced_winit = { version = "0.14.0-dev", features = ["program"] }
winit = "0.30.8"

[patch.crates-io]
iced = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
iced_wgpu = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
iced_winit = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
iced_core = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
iced_widget = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
iced_futures = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
iced_graphics = { git = "https://github.com/elefant-ai/iced.git", rev = "3676564" }
winit = { git = "https://github.com/iced-rs/winit.git", rev = "11414b6aa45699f038114e61b4ddf5102b2d3b4b" }

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "allow"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
default_trait_access = "deny"
filter_map_next = "deny"
from_over_into = "deny"
manual_let_else = "deny"
match-wildcard-for-single-variants = "deny"
needless_borrow = "deny"
new_without_default = "deny"
redundant-closure-for-method-calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
type-complexity = "allow"
unused_async = "deny"
useless_conversion = "deny"
upper_case_acronyms = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"

[workspace.metadata.cargo-machete]
ignored = ["prost"]
